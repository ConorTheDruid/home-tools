<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Pick For Me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@500;700;800&display=swap">
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="reel-strip" aria-hidden="true"></div>

  <div class="app">
    <p id="connBanner" class="conn-banner hidden"></p>

    <header>
      <h1 id="watchlistTitle">PICK FOR ME</h1>
    </header>

    <div class="view-switch" role="tablist">
      <button class="view-tab active" data-view="wheel" role="tab" aria-selected="true">Wheel</button>
      <button class="view-tab" data-view="history" role="tab" aria-selected="false">History</button>
      <button class="view-tab" data-view="rankings" role="tab" aria-selected="false">Rankings</button>
    </div>

    <section id="wheelView" class="view">
      <div class="tabs" role="tablist">
        <button class="tab active" data-cat="tv" role="tab" aria-selected="true">TV Shows</button>
        <button class="tab" data-cat="movies" role="tab" aria-selected="false">Movies</button>
      </div>

      <div class="main">
        <div class="wheel-wrap">
          <div class="pointer" aria-hidden="true"></div>
          <canvas id="wheel" width="420" height="420"></canvas>
          <p id="emptyMsg" class="empty-msg hidden">Add a title below to spin the wheel.</p>
        </div>
        <button id="spinBtn" class="spin-btn">Spin the wheel</button>
      </div>

      <div class="ticket">
        <div class="ticket-tear" aria-hidden="true"></div>
        <div class="ticket-body">
          <div class="add-form-wrap">
            <form id="addForm" class="add-form">
              <input id="addInput" type="text" placeholder="Add a title…" autocomplete="off" />
              <button type="submit">Add</button>
            </form>
            <div id="searchResults" class="search-results hidden"></div>
          </div>
          <ul id="itemList" class="item-list"></ul>
        </div>
      </div>
    </section>

    <section id="historyView" class="view hidden">
      <div class="history-subnav" role="tablist">
        <button class="subnav-pill active" data-subview="calendar" role="tab" aria-selected="true">Calendar</button>
        <button class="subnav-pill" data-subview="timeline" role="tab" aria-selected="false">Timeline</button>
        <button class="subnav-pill" data-subview="byShow" role="tab" aria-selected="false">By Show</button>
      </div>

      <div id="calendarPanel" class="history-panel">
        <div class="calendar-nav">
          <button id="calPrev" class="cal-nav-btn" aria-label="Previous month">‹</button>
          <span id="calMonthLabel" class="cal-month-label"></span>
          <button id="calNext" class="cal-nav-btn" aria-label="Next month">›</button>
        </div>
        <div id="calGrid" class="cal-grid"></div>
      </div>

      <div id="timelinePanel" class="history-panel hidden">
        <ul id="timelineList" class="timeline-list"></ul>
      </div>

      <div id="byShowPanel" class="history-panel hidden">
        <div class="history-group">
          <h2 class="history-heading">TV Shows</h2>
          <div id="tvHistory" class="history-cards"></div>
        </div>
        <div class="history-group">
          <h2 class="history-heading">Movies</h2>
          <div id="movieHistory" class="history-cards"></div>
        </div>
      </div>

      <p id="historyEmpty" class="empty-list hidden">Nothing watched yet — spin the wheel and mark something watched to start your history.</p>
    </section>

    <section id="rankingsView" class="view hidden">
      <div class="tabs" role="tablist">
        <button class="tab active" data-cat="tv" role="tab" aria-selected="true">TV Shows</button>
        <button class="tab" data-cat="movies" role="tab" aria-selected="false">Movies</button>
      </div>

      <ul id="rankingsList" class="rankings-list"></ul>
      <p id="rankingsEmpty" class="empty-list hidden">Nothing to rank yet — finish a series or watch a movie first.</p>
    </section>

  </div>

  <div id="resultModal" class="modal hidden">
    <div class="modal-content">
      <p class="modal-label">Tonight's showing</p>
      <h2 id="resultName"></h2>
      <div id="modalActions" class="modal-actions"></div>
    </div>
  </div>

  <script src="store-local.js"></script>
  <script src="tmdb-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
